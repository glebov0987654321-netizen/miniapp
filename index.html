<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мини Апп</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tg-bg: #0f0f13;
      --accent: #2AABEE;
      --accent2: #54c8f5;
      --text: #f0f0f5;
      --sub: #8888aa;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--tg-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }
    .blob1 {
      width: 420px; height: 420px;
      background: #2AABEE;
      top: -100px; left: -100px;
      animation-delay: 0s;
    }
    .blob2 {
      width: 300px; height: 300px;
      background: #7B61FF;
      bottom: -80px; right: -80px;
      animation-delay: 3s;
    }
    .blob3 {
      width: 200px; height: 200px;
      background: #00d9a7;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 52px 40px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      max-width: 340px;
      width: 90%;
      animation: popIn 0.7s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 20px;
      display: block;
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20%       { transform: rotate(-15deg); }
      40%       { transform: rotate(15deg); }
      60%       { transform: rotate(-10deg); }
      80%       { transform: rotate(10deg); }
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .username {
      font-family: 'Unbounded', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 14px;
      min-height: 1.4em;
    }

    p {
      color: var(--sub);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #7B61FF);
      border-radius: 2px;
      margin: 22px auto;
    }

    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--accent), #7B61FF);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(42,171,238,0.35);
      letter-spacing: 0.5px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(42,171,238,0.5); }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

<div class="bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="card">
  <span class="icon">👋</span>
  <h1>Привет!</h1>
  <div class="username" id="username"></div>
  <div class="divider"></div>
  <p>Добро пожаловать в мини-апп.<br/>Рады тебя видеть здесь!</p>
  <button class="btn" onclick="Telegram.WebApp.close()">Закрыть</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;
  const usernameEl = document.getElementById('username');

  if (user) {
    const name = [user.first_name, user.last_name].filter(Boolean).join(' ');
    usernameEl.textContent = name ? `@${user.username || name}` : '';
  }
</script>
</body>
</html>
